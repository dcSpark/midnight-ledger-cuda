[package]
name = "midnight-proof-server-cuda"
edition = "2024"
license.workspace = true
repository.workspace = true
version = "9.0.0-rc.3"
publish = false

[lib]
name = "proof_server_cuda"

[[bin]]
name = "proof-cuda-adapter"
path = "src/bin/proof_cuda_adapter.rs"
required-features = ["cuda-oxide"]
test = false

[features]
default = []
# Build this feature only through cargo-oxide/nightly once real kernels land.
cuda-oxide = [
    "dep:cuda-core",
    "dep:cuda-device",
    "dep:cuda-host",
]

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "baa1773ad834e6869f5341ff6dd0ba1b48c3e1b8", optional = true }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "baa1773ad834e6869f5341ff6dd0ba1b48c3e1b8", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "baa1773ad834e6869f5341ff6dd0ba1b48c3e1b8", optional = true }
