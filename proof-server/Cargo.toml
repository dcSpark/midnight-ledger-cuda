[package]
name = "midnight-proof-server"
edition = "2024"
license.workspace = true
version = "9.0.0-rc.3"
publish = false

[features]
default = []
cuda = ["dep:proof-server-cuda"]
cuda-oxide = ["cuda", "proof-server-cuda/cuda-oxide"]
deterministic-test-rng = ["ledger/test-utilities"]
experimental = ["dep:zkir-v3"]
metal = [
    "dep:midnight-gpu-prover",
    "midnight-gpu-prover/metal",
    "transient-crypto/gpu-metal-quotient-diagnostic",
    "zkir/gpu-metal-quotient-diagnostic",
    "zkir-v3?/gpu-metal-quotient-diagnostic",
]
metal-diagnostics = ["metal", "midnight-gpu-prover/metal-diagnostics"]
# Backwards-compatible feature alias. Resident quotient substitution is part of
# the production Metal build; the old name remains for existing build scripts.
metal-quotient-diagnostic = ["metal"]
gpu-blitzar = [
    "cuda",
    "dep:midnight-sppark-msm",
    "transient-crypto/gpu-blitzar",
    "zkir/gpu-blitzar",
    "zkir-v3?/gpu-blitzar",
]
perf-timers = []

[[bin]]
name = "proof-backend-parity"
path = "src/bin/proof_backend_parity.rs"
required-features = ["deterministic-test-rng"]
test = true

[[bin]]
name = "proof-request-profile"
path = "src/bin/proof_request_profile.rs"
required-features = ["deterministic-test-rng", "gpu-blitzar"]
test = false

[dependencies]
ledger = { path = "../ledger", package = "midnight-ledger-v9", default-features = false, features = ["proving"] }
zswap = { path = "../zswap", package = "midnight-zswap" }
coin-structure = { path = "../coin-structure", package = "midnight-coin-structure" }
base-crypto = { path = "../base-crypto", package = "midnight-base-crypto" }
transient-crypto = { path = "../transient-crypto", package = "midnight-transient-crypto" }
storage = { path = "../storage", package = "midnight-storage" }
serialize = { path = "../serialize", package = "midnight-serialize" }

zkir = { path = "../zkir", package = "midnight-zkir" }
zkir-v3 = { path = "../zkir-v3", package = "midnight-zkir-v3", optional = true }
proof-server-cuda = { path = "../proof-server-cuda", package = "midnight-proof-server-cuda", optional = true }
midnight-gpu-prover = { path = "../midnight-gpu-prover", optional = true }
midnight-sppark-msm = { path = "../midnight-sppark-msm", optional = true }

introspection = "0.1.0"
# rand 0.9.0 is not yet supported by some of our dependencies, we will
# stick with 0.8.0 for now.
rand = { version = "^0.8.4", features = ["getrandom"] }
actix-web = { version = "^4.13.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "cookies", "http2"] }
actix-cors = "^0.7.1"
futures = "^0.3.31"
futures-util = "0.3.32"
clap = { version = "^4.5.40", features = ["derive", "env"] }
tracing = "^0.1.41"
tracing-subscriber = "^0.3.19"
lazy_static = "^1.5.0"
regex = "1.11.1"
hex = "^0.4.3"
uuid = { version = "1.22.0", features = ["v4"] }
thiserror = "2.0.12"
tokio = "1.46.1"
async-channel = "2.5.0"
time = { version = "0.3.47", features = ["serde-human-readable"] }
serde = "1.0.219"
serde_json = "1.0.140"
anyhow = "^1.0.102"

[dev-dependencies]
midnight-proofs = { version = "^0.8.1", features = ["gpu-resident-graph-test-support"] }
ledger = { path = "../ledger", package = "midnight-ledger-v9", features = ["test-utilities", "proving"] }
onchain-runtime = { path = "../onchain-runtime", package = "midnight-onchain-runtime" }
transient-crypto = { path = "../transient-crypto", package = "midnight-transient-crypto" }
env_logger = "^0.11"
log = "^0.4.28"
function_name = "^0.3.0"
tokio = { version = "^1.46.1", features = ["full"] }
rustls = "0.23.28"
reqwest = { version = "^0.13.0", default-features = false, features = ["json", "rustls"] }
