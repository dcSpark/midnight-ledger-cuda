[package]
name = "midnight-gpu-prover"
edition = "2024"
license.workspace = true
repository.workspace = true
version = "0.1.0"
publish = false

[lib]
name = "midnight_gpu_prover"

[features]
default = []
cuda = ["dep:cuda-backend"]
metal = ["dep:metal-backend"]
metal-diagnostics = ["metal", "metal-backend/metal-diagnostics"]

[dependencies]
sha2 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
cuda-backend = {
    package = "midnight-sppark-msm",
    path = "../midnight-sppark-msm",
    default-features = false,
    features = ["cuda"],
    optional = true,
}

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
metal-backend = {
    package = "midnight-metal-prover",
    path = "../midnight-metal-prover",
    optional = true,
}
