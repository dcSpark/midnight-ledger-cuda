name: Ledger Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'ledger-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Fix Nix permissions (needed on macos self hosted runner)
        run: |
          sudo mkdir -m 0755 -p /nix/var/nix/{profiles,gcroots}/per-user/$USER
          sudo chown -R $USER:nixbld /nix/var/nix/{profiles,gcroots}/per-user/$USER
        shell: bash # Ensure bash is used for these commands

      - name: Add Homebrew and git bin to PATH for Yarn, verify git is installed
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/bin" >> $GITHUB_PATH
          which git
          git --version

      - name: Spellcheck comments
        run: |
          nix develop .#ci -c cargo spellcheck -j1

      # Native CUDA and Metal features require provisioned toolchains and are
      # checked in their own lanes. Keep this lane portable: selecting every
      # feature here would invoke nvcc on a generic runner, and selecting the
      # Metal package in a Nix sandbox would invoke Xcode outside its native lane.
      - name: Cargo clippy (portable workspace defaults)
        run: |
          MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo clippy \
            --all-targets --workspace \
            --exclude midnight-sppark-msm \
            --exclude midnight-metal-prover \
            --exclude midnight-gpu-prover \
            --exclude midnight-cuda-resident-multiopen-regression \
            --exclude midnight-proof-server-cuda \
            -- -Dwarnings -Aclippy::type_complexity -Aclippy::mutable_key_type -Aclippy::too_many_arguments -Aclippy::derived_hash_with_manual_eq -Aclippy::unbuffered_bytes

      - name: Cargo clippy (portable accelerator facades)
        run: |
          MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo clippy --locked \
            -p midnight-gpu-prover -p midnight-proof-server-cuda \
            --no-default-features --lib --no-deps -- -Dwarnings
          MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo clippy --locked \
            -p midnight-metal-prover --all-targets --no-deps -- -Dwarnings
          MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo clippy --locked \
            -p midnight-gpu-prover --features metal --all-targets --no-deps -- -Dwarnings
          MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo clippy --locked \
            -p midnight-proof-server --features metal --lib --no-deps -- -Dwarnings

      - name: Test unsupported Metal surface on Linux
        run: |
          MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo test --locked \
            -p midnight-metal-prover --all-targets
          MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo test --locked \
            -p midnight-gpu-prover --features metal
          MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo test --locked \
            -p midnight-proof-server --features metal prover_backend

      - name: Cargo doc
        run: MIDNIGHT_LEDGER_EXPERIMENTAL=1 MIDNIGHT_PP='' cargo doc --workspace --no-deps --exclude midnight-sppark-msm --exclude midnight-metal-prover --exclude midnight-cuda-resident-multiopen-regression

      - name: Cargo audit
        run: MIDNIGHT_LEDGER_EXPERIMENTAL=1 nix develop .#ci -c cargo audit

  metal-backend:
    # macos-15 is an Apple-silicon hosted runner, so this lane always compiles
    # the real metallib. Standard GitHub-hosted M1 VMs do not promise GPU
    # acceleration; device tests run only when the runner exposes Metal.
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Verify Apple Metal toolchain
        run: |
          test "$(uname -m)" = arm64
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent metalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib

      - name: Probe Metal device
        id: metal-device
        shell: bash
        run: |
          if xcrun swift -e 'import Darwin; import Metal; guard let device = MTLCreateSystemDefaultDevice() else { exit(1) }; print(device.name)' ; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This standard macOS runner exposes no Metal device; native tests require an xlarge or physical Apple-silicon runner."
          fi

      - name: Compile native Metal tests
        run: |
          cargo test --locked -p midnight-metal-prover --all-targets --no-run
          cargo test --locked -p bls12-381-metal-msm \
            --features metal-diagnostics --all-targets --no-run

      - name: Test fail-closed Metal routing
        run: |
          cargo test --locked -p midnight-gpu-prover --features metal
          cargo test --locked -p midnight-proof-server --features metal prover_backend

      - name: Test native Metal primitives
        if: steps.metal-device.outputs.available == 'true'
        run: |
          cargo test --locked -p midnight-metal-prover --all-targets -- --test-threads=1
          cargo test --locked -p bls12-381-metal-msm \
            --features metal-diagnostics --all-targets -- --test-threads=1

      - name: Clippy native Metal boundary
        run: |
          cargo clippy --locked -p midnight-metal-prover -p midnight-gpu-prover --features metal --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p midnight-proof-server --features metal --lib --no-deps -- -D warnings
          cargo clippy --locked -p bls12-381-metal-msm \
            --features metal-diagnostics --all-targets -- -D warnings

  build-wasm:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Install Nix (2)
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable #trya
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Fix Nix permissions (needed on macos self hosted runner)
        run: |
          sudo mkdir -m 0755 -p /nix/var/nix/{profiles,gcroots}/per-user/$USER
          sudo chown -R $USER:nixbld /nix/var/nix/{profiles,gcroots}/per-user/$USER
        shell: bash # Ensure bash is used for these commands

      - name: Build ledger-wasm
        run: nix build .#ledger-wasm

      - name: Build onchain-runtime-wasm
        run: nix build .#onchain-runtime-wasm

      - name: Build zkir-wasm
        run: nix build .#zkir-wasm

  integration-tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Install Nix (2)
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable #trya
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Build 
        run: nix build .#integration-test-deps

      - name: Add git bin to PATH for Yarn, verify git is installed
        run: |
          echo "/usr/bin" >> $GITHUB_PATH
          which git
          git --version

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Run integration tests
        run: |
          export MN_AXIOS=true
          set -o pipefail
          cd integration-tests
          yarn
          yarn lint
          yarn build
          yarn test:coverage:prepare
          nix develop .#ci -c yarn test:coverage | tee ./coverage.txt

      - name: Upload Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: logs-${{ matrix.os }}
          path: integration-tests/logs/

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "ledger-wasm-test-results-ctrf-${{ matrix.os }}"
          path: "./integration-tests/reports/ctrf-report.json"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "ledger-wasm-test-results-junit-${{ matrix.os }}"
          path: ./integration-tests/reports/test-report.xml

  build-ledger:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Install Nix (2)
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable #trya
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Fix Nix permissions (needed on macos self hosted runner)
        run: |
          sudo mkdir -m 0755 -p /nix/var/nix/{profiles,gcroots}/per-user/$USER
          sudo chown -R $USER:nixbld /nix/var/nix/{profiles,gcroots}/per-user/$USER
        shell: bash # Ensure bash is used for these commands

      - name: Add Homebrew and git bin to PATH for Yarn, verify git is installed
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/bin" >> $GITHUB_PATH
          which git
          git --version

      - name: Build and Test (default features)
        run: |
          cargo install cargo2junit
          nix develop .#ci -c cargo test --release -- -Z unstable-options --format json --report-time --nocapture --test-threads=1 | tee test-results.json
          # Filter is a workaround for johnterickson/cargo2junit#85
          jq -cR 'fromjson? | select( .type != "report" )' test-results.json | cargo2junit > ./target/test-results.xml
          cp test-results.json ./target/

  build-proof-server:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Install Nix (2)
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable #trya
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Fix Nix permissions (needed on macos self hosted runner)
        run: |
          sudo mkdir -m 0755 -p /nix/var/nix/{profiles,gcroots}/per-user/$USER
          sudo chown -R $USER:nixbld /nix/var/nix/{profiles,gcroots}/per-user/$USER
        shell: bash # Ensure bash is used for these commands

      - name: Add Homebrew and git bin to PATH for Yarn, verify git is installed
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/bin" >> $GITHUB_PATH
          which git
          git --version

      - name: Build and Test - Proof server (default features)
        run: |
          cargo install cargo2junit
          cd proof-server
          nix develop .#ci -c cargo test --release -- -Z unstable-options --format json --report-time --nocapture --test-threads=1 | tee test-results-proof-server.json
          # Filter is a workaround for johnterickson/cargo2junit#85
          jq -cR 'fromjson? | select( .type != "report" )' test-results-proof-server.json | cargo2junit > ../target/test-results-proof-server.xml
          cp test-results-proof-server.json ../target/

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "proof-server-test-results-${{ matrix.os }}"
          path: target/test-*
