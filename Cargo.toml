[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
members = [
    "bls12-381-metal-msm",
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "proof-server-cuda",
    "cuda-resident-multiopen-regression",
    "midnight-gpu-prover",
    "midnight-metal-prover",
    "midnight-sppark-msm",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "zkir-v3",
    "zkir-wasm",
    "zkir-v3-wasm",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core",
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch",
    # This is a normalized published manifest with stale examples, benches,
    # and integration tests. Keep it available through the patch below without
    # selecting those targets or unifying every protocol feature in broad
    # workspace jobs.
    "vendor/midnight-proofs-0.8.1",
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

# Optimized binaries with enough symbol information for Metal System Trace and
# Instruments. Keep this separate from release artifacts, which may be stripped.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = 2
strip = false

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Because we pull in older, crates.io versions of `transient-crypto`, we need
# to force these to resolve locally for a local build. These patches not being
# present in consumer builds is fine, as they don't/shouldn't *want* the local
# packages.
[patch.crates-io]
midnight-base-crypto = { path = "base-crypto" }
midnight-serialize = { path = "serialize" }
midnight-curves = { path = "vendor/midnight-curves-0.3.1" }
midnight-circuits = { path = "vendor/midnight-circuits-7.2.2" }
midnight-proofs = { path = "vendor/midnight-proofs-0.8.1" }
midnight-zk-stdlib = { path = "vendor/midnight-zk-stdlib-2.3.3" }
sppark = { path = "vendor/sppark-0.1.15" }
# Because we rely on additions in 2.2
midnight-transient-crypto-old = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1", package = "midnight-transient-crypto" }

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"
